version: '3.8'

services:
  # PostgreSQL Database with Automated Role Initialization
  postgres:
    image: postgres:16-alpine
    container_name: balancevault-postgres
    restart: always
    environment:
      POSTGRES_USER: bv_owner
      POSTGRES_PASSWORD: bv_owner_secure_password_2026
      POSTGRES_DB: balancevault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/setup-db-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bv_owner -d balancevault"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Distributed Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: balancevault-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # BalanceVault API Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: balancevault-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://bv_owner:bv_owner_secure_password_2026@postgres:5432/balancevault?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "balancevault-docker-prod-secret-2026"
      JWT_EXPIRES_IN: "24h"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # BalanceVault React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: balancevault-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
